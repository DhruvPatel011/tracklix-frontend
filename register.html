<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Tracklix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/png" href="assets/images/image.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .btn-google {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:13px 20px; border:1.5px solid #e2e8f0;
      border-radius:10px; background:#fff; color:#1e293b;
      font-family:'DM Sans',sans-serif; font-size:.9rem; font-weight:500;
      cursor:pointer; transition:all .2s; text-decoration:none; margin-bottom:8px;
    }
    .btn-google:hover { background:#f8fafc; border-color:#94a3b8; }
    .btn-google img { width:18px; height:18px; }
  </style>
</head>
<body class="auth-body">
  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card auth-card--wide">
      <div class="auth-brand">
        <div class="brand-icon brand-icon--img"><img src="assets/images/image.png" alt="Tracklix Logo" /></div>
        <span class="brand-name">Tracklix</span>
      </div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Start managing your finances smarter</p>

      <div id="regAlert" class="alert hidden"></div>

      <a href="#" id="googleRegBtn" class="btn-google">
        <img src="https://www.google.com/favicon.ico" alt="Google" />
        Sign up with Google
      </a>

      <div class="auth-divider"><span>or register with email</span></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-row">
          <div class="field-group">
            <label for="regName">Full Name</label>
            <div class="input-wrap">
              <i class="fa-regular fa-user input-icon"></i>
              <input type="text" id="regName" placeholder="John Doe" required />
            </div>
          </div>
          <div class="field-group">
            <label for="regEmail">Email Address</label>
            <div class="input-wrap">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="regEmail" placeholder="you@example.com" required />
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="field-group">
            <label for="regPassword">Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="regPassword" placeholder="Min 8 characters" required />
              <button type="button" class="toggle-pw" id="togglePw1"><i class="fa-regular fa-eye"></i></button>
            </div>
            <div class="pw-strength">
              <div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div>
              <span id="pwLabel"></span>
            </div>
          </div>
          <div class="field-group">
            <label for="regConfirm">Confirm Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="regConfirm" placeholder="Repeat password" required />
              <button type="button" class="toggle-pw" id="togglePw2"><i class="fa-regular fa-eye"></i></button>
            </div>
          </div>
        </div>
        <div class="field-group">
          <label for="regCurrency">Preferred Currency</label>
          <div class="input-wrap">
            <i class="fa-solid fa-coins input-icon"></i>
            <select id="regCurrency">
              <option value="₹">₹ INR – Indian Rupee</option>
              <option value="$">$ USD – US Dollar</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label for="regOtp">Email Verification Code</label>
          <div class="input-wrap">
            <i class="fa-solid fa-shield-halved input-icon"></i>
            <input
              type="text"
              id="regOtp"
              placeholder="Enter 6-digit OTP"
              inputmode="numeric"
              maxlength="6"
              autocomplete="one-time-code"
              disabled
            />
          </div>
          <span id="otpStatus" class="field-error"></span>

          <button type="button" id="sendOtpBtn" class="btn-primary">
            Send Email OTP
          </button>

          <button
            type="button"
            id="verifyOtpBtn"
            class="btn-primary"
            disabled
            style="margin-top:10px"
          >
            Verify OTP
          </button>
        </div>

        <button type="submit" class="btn-primary" id="regBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader hidden"><i class="fa-solid fa-spinner fa-spin"></i></span>
        </button>
      </form>
      <p class="auth-link">Already have an account? <a href="index.html">Sign in</a></p>
    </div>
  </div>

  <script type="module">

    import { BACKEND_BASE } from './js/storage.js';

    const $ = (id) => document.getElementById(id);

    const form = $('registerForm');
    const alertBox = $('regAlert');
    const otpInput = $('regOtp');
    const otpStatus = $('otpStatus');
    const sendBtn = $('sendOtpBtn');
    const verifyBtn = $('verifyOtpBtn');
    const createBtn = form.querySelector('[type="submit"]');

    let otpSent = false;
    let emailVerified = false;
    let busy = false;

    function showAlert(message, type = 'error') {
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.classList.remove('hidden');
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      verifyBtn.disabled = value || !otpSent || emailVerified;
      createBtn.disabled = value || !emailVerified;
    }

    async function postJSON(path, payload) {
      const response = await fetch(`${BACKEND_BASE}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.message || 'Request failed. Please try again.');
      }

      return data;
    }

    function getFormData() {
      return {
        name: $('regName').value.trim(),
        email: $('regEmail').value.trim().toLowerCase(),
        password: $('regPassword').value,
        confirm: $('regConfirm').value,
        currency: $('regCurrency').value
      };
    }

    function validateForm() {
      const data = getFormData();

      if (!data.name || !data.email || !data.password || !data.confirm) {
        throw new Error('Please complete all required fields.');
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
        throw new Error('Please enter a valid email address.');
      }

      if (data.password.length < 8) {
        throw new Error('Password must be at least 8 characters.');
      }

      if (data.password !== data.confirm) {
        throw new Error('Passwords do not match.');
      }

      return data;
    }

    // Password visibility
    function togglePassword(buttonId, inputId) {
      $(buttonId).addEventListener('click', () => {
        const input = $(inputId);
        const icon = $(buttonId).querySelector('i');
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.className = input.type === 'password'
          ? 'fa-regular fa-eye'
          : 'fa-regular fa-eye-slash';
      });
    }

    togglePassword('togglePw1', 'regPassword');
    togglePassword('togglePw2', 'regConfirm');

    // Password strength indicator
    $('regPassword').addEventListener('input', (event) => {
      const value = event.target.value;
      let score = 0;

      if (value.length >= 8) score++;
      if (/[A-Z]/.test(value)) score++;
      if (/[0-9]/.test(value)) score++;
      if (/[^a-zA-Z0-9]/.test(value)) score++;

      const colors = ['', '#ef4444', '#f59e0b', '#06b6d4', '#10b981'];
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

      $('pwFill').style.width = `${score * 25}%`;
      $('pwFill').style.background = colors[score];
      $('pwLabel').textContent = labels[score];
      $('pwLabel').style.color = colors[score];
    });

    // If email changes after sending/verifying OTP, require a new OTP.
    $('regEmail').addEventListener('input', () => {
      otpSent = false;
      emailVerified = false;
      otpInput.value = '';
      otpInput.disabled = true;
      otpStatus.textContent = '';
      verifyBtn.disabled = true;
      createBtn.disabled = false;
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send Email OTP';
    });

    sendBtn.addEventListener('click', async () => {
      if (busy) return;

      try {
        const data = validateForm();
        setBusy(true);
        showAlert('Sending verification code…', 'success');

        await postJSON('/api/otp/send', {
          email: data.email,
          purpose: 'email_verify'
        });

        otpSent = true;
        emailVerified = false;
        otpInput.disabled = false;
        verifyBtn.disabled = false;
        otpStatus.textContent = 'Check your inbox for the 6-digit code.';
        sendBtn.textContent = 'Resend Email OTP';
        showAlert('OTP sent. Check your email, including Spam/Junk.', 'success');
      } catch (error) {
        showAlert(error.message);
      } finally {
        setBusy(false);
      }
    });

    verifyBtn.addEventListener('click', async () => {
      if (busy || !otpSent) return;

      const otp = otpInput.value.trim();

      if (!/^\d{6}$/.test(otp)) {
        otpStatus.textContent = 'Enter a valid 6-digit OTP.';
        return;
      }

      try {
        const data = getFormData();
        setBusy(true);

        await postJSON('/api/otp/verify', {
          email: data.email,
          otp,
          purpose: 'email_verify'
        });

        emailVerified = true;
        otpInput.disabled = true;
        verifyBtn.disabled = true;
        sendBtn.disabled = true;
        createBtn.disabled = false;
        otpStatus.textContent = 'Email verified successfully.';
        showAlert('Email verified! You can now create your account.', 'success');
      } catch (error) {
        showAlert(error.message);
      } finally {
        setBusy(false);
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (busy) return;

      try {
        if (!emailVerified) {
          throw new Error('Please verify your email before creating an account.');
        }

        const data = validateForm();
        const otp = otpInput.value.trim();

        setBusy(true);

        await postJSON('/api/auth/register', {
          name: data.name,
          email: data.email,
          password: data.password,
          currency: data.currency,
          otp
        });

        showAlert('Account created! Redirecting to sign in…', 'success');

        form.reset();
        emailVerified = false;
        otpSent = false;

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      } catch (error) {
        showAlert(error.message);
      } finally {
        setBusy(false);
      }
    });

    // Registration is disabled until the OTP is verified.
    createBtn.disabled = true;
    verifyBtn.disabled = true;
    otpInput.disabled = true;

  </script>
</body>
</html>
